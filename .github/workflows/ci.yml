name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run test suite
        run: python -m pytest tests/ -v

  windows-smoke:
    # The suite mocks sys.platform, so it passes anywhere. This job runs the
    # platform code UNMOCKED on a real Windows runner: real %LOCALAPPDATA%,
    # real py launcher, real file system. It exists because the Windows cache
    # fix (#1) could not be verified on a Windows machine by the maintainers.
    name: windows smoke (unmocked platform code)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Windows smoke tests
        run: python -m pytest tests/test_smoke_windows.py -v
